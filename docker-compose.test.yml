name: hospital-dwh-catalogue

services:
  db:
    image: postgres:17
    container_name: hospital_dwh_db_test
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hospital_dwh_redis_test
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hospital_dwh_web_test
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: gunicorn catalogue.wsgi:application --bind 0.0.0.0:8000 --workers 2
    volumes:
      - .:/app
      - staticfiles_test:/app/staticfiles
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=catalogue.settings.test
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/')\""]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hospital_dwh_scheduler_test
    entrypoint: ["/bin/sh", "/app/docker/scheduler-entrypoint.sh"]
    volumes:
      - .:/app
      - staticfiles_test:/app/staticfiles
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=catalogue.settings.test
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: hospital_dwh_nginx_test
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/test.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/error_pages:/etc/nginx/error_pages:ro
      - staticfiles_test:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_started

  # --- Observability stack (always on in test) ---

  loki:
    image: grafana/loki:3.0.0
    container_name: hospital_dwh_loki_test
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data_test:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: hospital_dwh_promtail_test
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/config-test.yml:/etc/promtail/config.yml:ro
      - ./logs:/app/logs:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: hospital_dwh_grafana_test
    volumes:
      - grafana_data_test:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data_test:
    name: hospital_dwh_postgres_data_test
  staticfiles_test:
    name: hospital_dwh_staticfiles_test
  loki_data_test:
    name: hospital_dwh_loki_data_test
  grafana_data_test:
    name: hospital_dwh_grafana_data_test
