name: hospital-dwh-catalogue

services:
  db:
    image: postgres:17
    container_name: hospital_dwh_db_test
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hospital_dwh_redis_test
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hospital_dwh_web_test
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: gunicorn catalogue.wsgi:application --bind 0.0.0.0:8000 --workers 2
    volumes:
      - .:/app
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=catalogue.settings.test
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data_test:
    name: hospital_dwh_postgres_data_test
