name: hospital-dwh-catalogue

services:
  db:
    image: postgres:17
    container_name: hospital_dwh_db_prod
    env_file:
      - .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hospital_network

  redis:
    image: redis:7-alpine
    container_name: hospital_dwh_redis_prod
    # Persistence is required: sessions are stored in Redis (SESSION_ENGINE=cache).
    # Disabling --save would log out all users on every Redis restart.
    # --save 300 1 = snapshot every 5 min if ≥1 key changed (less I/O than default 60s).
    command: redis-server --save 300 1 --loglevel warning
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hospital_dwh_web_prod
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: gunicorn catalogue.wsgi:application --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS}
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=catalogue.settings.prod
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hospital_network

volumes:
  postgres_data_prod:
    name: hospital_dwh_postgres_data_prod
  redis_data_prod:
    name: hospital_dwh_redis_data_prod

networks:
  hospital_network:
    name: hospital_dwh_network
    driver: bridge
