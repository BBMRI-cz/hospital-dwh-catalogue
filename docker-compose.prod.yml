name: hospital-dwh-catalogue

services:
  db:
    image: postgres:17
    container_name: hospital_dwh_db_prod
    env_file:
      - .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hospital_network

  redis:
    image: redis:7-alpine
    container_name: hospital_dwh_redis_prod
    # Persistence is required: sessions are stored in Redis (SESSION_ENGINE=cache).
    # Disabling --save would log out all users on every Redis restart.
    # --save 300 1 = snapshot every 5 min if ≥1 key changed (less I/O than default 60s).
    command: redis-server --save 300 1 --loglevel warning
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hospital_dwh_web_prod
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: gunicorn catalogue.wsgi:application --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS}
    volumes:
      - staticfiles_prod:/app/staticfiles
      - logs_prod:/app/logs
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=catalogue.settings.prod
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/')\""]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks:
      - hospital_network

  scheduler:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hospital_dwh_scheduler_prod
    entrypoint: ["/bin/sh", "/app/docker/scheduler-entrypoint.sh"]
    volumes:
      - logs_prod:/app/logs
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=catalogue.settings.prod
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hospital_network

  nginx:
    image: nginx:1.27-alpine
    container_name: hospital_dwh_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf.template:ro
      - ./docker/nginx/conf.d/bootstrap.conf:/etc/nginx/conf.d/bootstrap.conf.template:ro
      - ./docker/nginx/error_pages:/etc/nginx/error_pages:ro
      - staticfiles_prod:/app/staticfiles:ro
      - letsencrypt_data:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    environment:
      - SERVER_NAME=${SERVER_NAME}
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    networks:
      - hospital_network
    command: >
      /bin/sh -c
      "if [ -f /etc/letsencrypt/live/$$SERVER_NAME/fullchain.pem ];
      then envsubst '$$SERVER_NAME' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf;
      else envsubst '$$SERVER_NAME' < /etc/nginx/conf.d/bootstrap.conf.template > /etc/nginx/conf.d/default.conf;
      fi && while :; do sleep 6h; nginx -s reload 2>/dev/null || true; done &
      nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: hospital_dwh_certbot_prod
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Auto-renewal daemon
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"]
    restart: unless-stopped
    networks:
      - hospital_network

  # --- Observability stack ---

  loki:
    image: grafana/loki:3.0.0
    container_name: hospital_dwh_loki_prod
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data_prod:/loki
    restart: unless-stopped
    networks:
      - hospital_network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: hospital_dwh_promtail_prod
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - logs_prod:/app/logs:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - hospital_network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: hospital_dwh_grafana_prod
    # No direct port exposure — access only via Nginx at /grafana/
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_DOMAIN=${SERVER_NAME}
      - GF_SERVER_ROOT_URL=https://${SERVER_NAME}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - hospital_network

volumes:
  postgres_data_prod:
    name: hospital_dwh_postgres_data_prod
  redis_data_prod:
    name: hospital_dwh_redis_data_prod
  staticfiles_prod:
    name: hospital_dwh_staticfiles_prod
  logs_prod:
    name: hospital_dwh_logs_prod
  loki_data_prod:
    name: hospital_dwh_loki_data_prod
  grafana_data_prod:
    name: hospital_dwh_grafana_data_prod
  letsencrypt_data:
    name: hospital_dwh_letsencrypt
  certbot_webroot:
    name: hospital_dwh_certbot_webroot

networks:
  hospital_network:
    name: hospital_dwh_network
    driver: bridge
