name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: |
          echo "Running linter..."
          if ruff check .; then
            echo "PASSED: No linting issues found"
          else
            echo "FAILED: Linting errors detected"
            echo ""
            echo "To fix: run './scripts/check.sh' locally"
            exit 1
          fi

      - name: Run Ruff formatter check
        run: |
          echo "Checking code formatting..."
          if ruff format --check .; then
            echo "PASSED: All files properly formatted"
          else
            echo "FAILED: Some files need formatting"
            echo ""
            echo "To fix: run './scripts/check.sh' locally"
            exit 1
          fi

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up environment
        run: cp .env.dev.example .env

      - name: Run mypy
        run: |
          echo "Running type checker..."
          if mypy .; then
            echo "PASSED: No type errors found"
          else
            echo "FAILED: Type errors detected"
            echo ""
            echo "These must be fixed manually"
            exit 1
          fi

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Check for fuzzy translations
        run: |
          echo "Checking for fuzzy translations..."
          
          if grep -r "^#, fuzzy" locale/*/LC_MESSAGES/django.po 2>/dev/null; then
            echo "FAILED: Fuzzy translations found - please review and update"
            exit 1
          fi
          
          echo "  No fuzzy translations found"

      - name: Check for empty translations
        run: |
          echo "Checking for empty translations..."
          
          # Find msgid followed by msgstr "" with no continuation (truly empty)
          for po_file in locale/*/LC_MESSAGES/django.po; do
            if awk '
              /^msgid "[^"]/ {
                msgid=$0
                line=NR
                getline
                if (/^msgstr ""$/) {
                  getline
                  # Empty if next line is blank, a comment, or another msgid
                  if ($0 ~ /^$/ || $0 ~ /^#/ || $0 ~ /^msgid/) {
                    print FILENAME ":" line ":" msgid
                    found++
                  }
                }
              }
              END { exit (found > 0) }
            ' "$po_file" 2>&1; then
              : # Continue
            else
              echo "FAILED: Empty translations found in $po_file"
              exit 1
            fi
          done
          
          echo "PASSED: All strings are translated"

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit security linter
        run: |
          echo "Running security scan..."
          if bandit -r . -x ./warehouse/static,./venv,./.venv,./node_modules -ll; then
            echo "PASSED: No security issues found"
          else
            echo "FAILED: Security issues detected"
            echo ""
            echo "Common fixes:"
            echo "  - Use format_html() instead of mark_safe()"
            echo "  - Use parameterized queries instead of f-strings in SQL"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up environment
        run: cp .env.dev.example .env

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: catalogue.settings.test
        run: |
          echo "Running tests..."
          if python manage.py test --verbosity 2; then
            echo "PASSED: All tests passed"
          else
            echo "FAILED: Some tests failed"
            exit 1
          fi

  ci-success:
    name: CI Result
    needs: [lint, type-check, translations, security, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "========================================"
          echo "CI Results"
          echo "========================================"
          echo ""
          echo "  Lint:         ${{ needs.lint.result }}"
          echo "  Type Check:   ${{ needs.type-check.result }}"
          echo "  Translations: ${{ needs.translations.result }}"
          echo "  Security:     ${{ needs.security.result }}"
          echo "  Tests:        ${{ needs.test.result }}"
          echo ""
          
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.translations.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "========================================"
            echo "FAILED: Some checks did not pass"
            echo "========================================"
            echo ""
            echo "Run './scripts/check.sh' locally to fix auto-fixable issues."
            exit 1
          fi
          
          echo "========================================"
          echo "PASSED: All checks successful"
          echo "========================================"

