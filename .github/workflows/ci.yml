name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          echo "Running linter..."
          ./scripts/check-lint.sh --check

      - name: Run formatting check
        run: |
          echo "Checking code formatting..."
          ./scripts/check-format.sh --check

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up environment
        run: cp .env.dev.example .env

      - name: Run mypy
        run: |
          echo "Running type checker..."
          ./scripts/check-types.sh

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Check translations
        run: |
          echo "Checking translations..."
          ./scripts/check-translations.sh

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit security linter
        run: |
          echo "Running security scan..."
          ./scripts/check-security.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up environment
        run: cp .env.dev.example .env

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: catalogue.settings.ci
        run: |
          echo "Running tests..."
          ./scripts/check-tests.sh

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -f docker/Dockerfile -t hospital-dwh-catalogue-ci:${{ github.sha }} .
          echo "Docker image built successfully"

  ci-success:
    name: CI Result
    needs: [lint, type-check, translations, security, test, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "========================================"
          echo "CI Results"
          echo "========================================"
          echo ""
          echo "  Lint:         ${{ needs.lint.result }}"
          echo "  Type Check:   ${{ needs.type-check.result }}"
          echo "  Translations: ${{ needs.translations.result }}"
          echo "  Security:     ${{ needs.security.result }}"
          echo "  Tests:        ${{ needs.test.result }}"
          echo "  Docker Build: ${{ needs.docker-build.result }}"
          echo ""
          
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.translations.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "========================================"
            echo "FAILED: Some checks did not pass"
            echo "========================================"
            echo ""
            echo "Run './scripts/check.sh' locally to fix auto-fixable issues."
            exit 1
          fi
          
          echo "========================================"
          echo "PASSED: All checks successful"
          echo "========================================"

