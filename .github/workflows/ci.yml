name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: |
          echo "Running linter..."
          if ruff check .; then
            echo "PASSED: No linting issues found"
          else
            echo "FAILED: Linting errors detected"
            echo ""
            echo "To fix: run './scripts/lint.sh' locally"
            exit 1
          fi

      - name: Run Ruff formatter check
        run: |
          echo "Checking code formatting..."
          if ruff format --check .; then
            echo "PASSED: All files properly formatted"
          else
            echo "FAILED: Some files need formatting"
            echo ""
            echo "To fix: run './scripts/lint.sh' locally"
            exit 1
          fi

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: |
          echo "Running type checker..."
          if mypy .; then
            echo "PASSED: No type errors found"
          else
            echo "FAILED: Type errors detected"
            echo ""
            echo "These must be fixed manually"
            exit 1
          fi

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing translations
        env:
          SECRET_KEY: "test-secret-key-for-ci"
          DJANGO_SETTINGS_MODULE: "catalogue.settings.test"
          USE_SQLITE: "True"
        run: |
          echo "Checking translation files..."
          python manage.py makemessages -l cs -l en --no-location
          
          if git diff --name-only | grep -q "\.po$"; then
            echo "FAILED: Translation files are out of date"
            echo ""
            echo "Changed files:"
            git diff --name-only | grep "\.po$"
            echo ""
            echo "To fix: run 'python manage.py makemessages -l cs -l en'"
            exit 1
          fi
          
          echo "PASSED: All translations are up to date"

      - name: Check for untranslated strings
        run: |
          echo "Checking for untranslated strings..."
          has_untranslated=false
          for file in locale/*/LC_MESSAGES/django.po; do
            untranslated=$(grep -B1 'msgstr ""$' "$file" | grep -c 'msgid ".' || true)
            if [ "$untranslated" -gt 0 ]; then
              echo "WARNING: $file has $untranslated untranslated string(s)"
              has_untranslated=true
            fi
          done
          if [ "$has_untranslated" = false ]; then
            echo "PASSED: All strings are translated"
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit security linter
        run: |
          echo "Running security scan..."
          if bandit -r . -x ./warehouse/static,./venv,./.venv,./node_modules -ll; then
            echo "PASSED: No security issues found"
          else
            echo "FAILED: Security issues detected"
            echo ""
            echo "Common fixes:"
            echo "  - Use format_html() instead of mark_safe()"
            echo "  - Use parameterized queries instead of f-strings in SQL"
            exit 1
          fi

  ci-success:
    name: CI Result
    needs: [lint, type-check, translations, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "========================================"
          echo "CI Results"
          echo "========================================"
          echo ""
          echo "  Lint:         ${{ needs.lint.result }}"
          echo "  Type Check:   ${{ needs.type-check.result }}"
          echo "  Translations: ${{ needs.translations.result }}"
          echo "  Security:     ${{ needs.security.result }}"
          echo ""
          
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.translations.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "========================================"
            echo "FAILED: Some checks did not pass"
            echo "========================================"
            echo ""
            echo "Run './scripts/lint.sh' locally to fix auto-fixable issues."
            exit 1
          fi
          
          echo "========================================"
          echo "PASSED: All checks successful"
          echo "========================================"

