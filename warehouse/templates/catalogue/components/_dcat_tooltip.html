{% load i18n %}
{# DCAT-AP info modal — shown by showDcatInfo(field) JS call #}
<dialog id="dcat-info-modal" class="modal">
  <div class="modal-box max-w-2xl">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-serif text-xl text-gray-900 flex items-center gap-2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#53c0d7">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        DCAT-AP
      </h3>
      <form method="dialog">
        <button class="btn btn-ghost btn-sm btn-circle text-gray-400">✕</button>
      </form>
    </div>
    <div id="dcat-modal-content" class="min-h-24">
      <div class="mb-3 flex items-center gap-3">
        <span id="dcat-prefix" class="badge font-mono text-xs border" style="background:#e0f0fb;color:#007fc8;border-color:#6dc0eb;"></span>
        <span id="dcat-label" class="font-serif text-lg text-gray-800"></span>
      </div>
      <div id="dcat-req-wrap" class="mb-3 hidden">
        <span id="dcat-req" class="badge badge-sm font-mono"></span>
      </div>
      <dl class="space-y-3">
        <div>
          <dt class="font-mono text-[9.5px] uppercase tracking-wider text-gray-400 mb-1">{% trans "Description" %}</dt>
          <dd id="dcat-desc" class="text-sm text-gray-700 leading-relaxed"></dd>
        </div>
        <div id="dcat-range-wrap" class="hidden">
          <dt class="font-mono text-[9.5px] uppercase tracking-wider text-gray-400 mb-1">{% trans "Expected type" %}</dt>
          <dd id="dcat-range" class="text-sm font-mono text-gray-500"></dd>
        </div>
        <div>
          <dt class="font-mono text-[9.5px] uppercase tracking-wider text-gray-400 mb-1">URI</dt>
          <dd>
            <a id="dcat-uri-link" href="#" target="_blank" rel="noopener"
              class="text-sm font-mono no-underline transition-colors flex items-center gap-1.5 break-all" style="color:#53c0d7">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
              </svg>
              <span id="dcat-uri-text"></span>
            </a>
          </dd>
        </div>
      </dl>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>{% trans "Close" %}</button></form>
</dialog>
