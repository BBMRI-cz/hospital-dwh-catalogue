{% load i18n %}

{% get_current_language as LANGUAGE_CODE %}
<div class="btn-group" role="group" aria-label="Language selector">
    <button type="button" onclick="switchLanguage('cs')" class="btn btn-sm {% if LANGUAGE_CODE == 'cs' %}btn-primary{% else %}btn-outline-primary{% endif %}">
        CZ
    </button>
    <button type="button" onclick="switchLanguage('en')" class="btn btn-sm {% if LANGUAGE_CODE == 'en' %}btn-primary{% else %}btn-outline-primary{% endif %}">
        EN
    </button>
</div>

<form id="language-form" action="{% url 'set_language' %}" method="post" style="display: none;">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}" />
    <input name="language" type="hidden" id="language-input" value="" />
</form>

<script>
function switchLanguage(langCode) {
    document.getElementById('language-input').value = langCode;
    document.getElementById('language-form').submit();
}
</script>
