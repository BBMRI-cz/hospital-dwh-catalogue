{% load i18n static %}
<!-- Schema Info Modal — populated by showSchemaModal(semantics) JS function -->
<dialog id="schema-modal" class="modal modal-middle"
  style="border:none;background:transparent;padding:0;"
  onclick="if(event.target===this)this.close()">
  <div class="modal-box p-0 shadow-2xl border border-gray-200 overflow-hidden" style="width:32rem;max-width:calc(100vw - 2rem);border-radius:1rem;">

    <!-- ── Header ───────────────────────────────────────────────── -->
    <div class="px-6 pt-5 pb-5 modal-gradient-header">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-0.5 h-4 rounded shrink-0 bg-mou-cyan"></div>
        <span class="font-mono text-[9.5px] uppercase tracking-widest text-mou-cyan">{% trans "DCAT-AP term" %}</span>
      </div>
      <div class="flex items-start gap-3">
        <span id="sm-prefix"
          class="badge font-mono text-[11px] px-2 py-0.5 shrink-0 mt-1 rounded"
          class="badge font-mono text-[11px] px-2 py-0.5 shrink-0 mt-1 rounded bg-mou-blue-light text-mou-blue border border-mou-blue-border"></span>
        <div class="min-w-0">
          <h3 id="sm-label" class="font-serif text-xl leading-tight text-gray-900"></h3>
          <p id="sm-name" class="font-mono text-[11px] text-txt-muted mt-0.5 truncate"></p>
        </div>
      </div>
    </div>

    <!-- ── Body ─────────────────────────────────────────────────── -->
    <div class="px-6 pt-5 pb-5 bg-white space-y-4">
      <div class="flex items-center gap-3">
        <div id="sm-req"></div>
        <span id="sm-card" class="font-mono text-[10px] text-txt-muted" style="display:none"></span>
      </div>
      <div>
        <p class="font-mono text-[9px] uppercase tracking-widest text-txt-muted mb-1.5">{% trans "Description" %}</p>
        <p id="sm-desc" class="text-sm text-gray-700 leading-relaxed"></p>
      </div>
      <div>
        <p class="font-mono text-[9px] uppercase tracking-widest text-txt-muted mb-1.5">URI</p>
        <a id="sm-uri" href="#" target="_blank" rel="noopener"
          class="flex items-center gap-2 font-mono text-[11px] rounded-lg px-3 py-2.5 border border-gray-200 bg-gray-50 hover:bg-mou-cyan-light hover:border-mou-cyan-border transition-colors break-all"
          class="flex items-center gap-2 font-mono text-[11px] rounded-lg px-3 py-2.5 border border-gray-200 bg-gray-50 hover:bg-mou-cyan-light hover:border-mou-cyan-border transition-colors break-all text-mou-blue">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span id="sm-uri-text" class="break-all"></span>
        </a>
      </div>
    </div>

  </div>
</dialog>

<script src="{% static 'js/schema-modal.js' %}"></script>
