{% load i18n %}
<!-- Schema Info Modal — populated by showSchemaModal(semantics) JS function -->
<dialog id="schema-modal" class="modal modal-middle"
  style="border:none;background:transparent;padding:0;"
  onclick="if(event.target===this)this.close()">
  <div class="modal-box max-w-lg p-0 shadow-2xl border border-gray-200 overflow-hidden" style="border-radius:1rem;">

    <!-- ── Header ───────────────────────────────────────────────── -->
    <div class="px-6 pt-5 pb-5" style="background:linear-gradient(135deg,#e8f7fb 0%,#f4fbfd 100%);border-bottom:1px solid #9ddcea;">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-0.5 h-4 rounded shrink-0" style="background:#53c0d7;"></div>
        <span class="font-mono text-[9.5px] uppercase tracking-widest" style="color:#53c0d7;">{% trans "DCAT-AP term" %}</span>
      </div>
      <div class="flex items-start gap-3">
        <span id="sm-prefix"
          class="badge font-mono text-[11px] px-2 py-0.5 shrink-0 mt-1 rounded"
          style="background:#e0f0fb;color:#007fc8;border:1px solid #6dc0eb;"></span>
        <div class="min-w-0">
          <h3 id="sm-label" class="font-serif text-xl leading-tight text-gray-900"></h3>
          <p id="sm-name" class="font-mono text-[11px] text-gray-400 mt-0.5 truncate"></p>
        </div>
      </div>
    </div>

    <!-- ── Body ─────────────────────────────────────────────────── -->
    <div class="px-6 pt-5 pb-5 bg-white space-y-4">
      <div id="sm-req"></div>
      <div>
        <p class="font-mono text-[9px] uppercase tracking-widest text-gray-400 mb-1.5">{% trans "Description" %}</p>
        <p id="sm-desc" class="text-sm text-gray-700 leading-relaxed"></p>
      </div>
      <div>
        <p class="font-mono text-[9px] uppercase tracking-widest text-gray-400 mb-1.5">URI</p>
        <a id="sm-uri" href="#" target="_blank" rel="noopener"
          class="flex items-center gap-2 font-mono text-[11px] rounded-lg px-3 py-2.5 border border-gray-200 bg-gray-50 hover:bg-[#e8f7fb] hover:border-[#9ddcea] transition-colors break-all"
          style="color:#007fc8;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span id="sm-uri-text" class="break-all"></span>
        </a>
      </div>
    </div>

  </div>
</dialog>

<script>
/* Global schema data — populated by each page that uses ⓘ buttons */
let SCHEMA_DATA = {};

function loadSchemaData(jsonElementId) {
  try {
    const el = document.getElementById(jsonElementId);
    if (el) SCHEMA_DATA = JSON.parse(el.textContent);
  } catch(e) { console.warn('Could not parse schema data', e); }
}

function showSchemaModal(semantics) {
  const s = SCHEMA_DATA[semantics];
  if (!s) return;

  document.getElementById('sm-prefix').textContent   = s.prefix + ':';
  document.getElementById('sm-label').textContent    = s.label || s.local_name;
  document.getElementById('sm-name').textContent     = s.prefix + ':' + s.local_name;
  document.getElementById('sm-desc').textContent     = s.description;
  document.getElementById('sm-uri').href             = s.uri;
  document.getElementById('sm-uri-text').textContent = s.uri;

  const reqEl = document.getElementById('sm-req');
  const reqMap = {
    mandatory:   ['Mandatory',   'bg-green-50 text-green-800 border-green-200'],
    recommended: ['Recommended', 'bg-amber-50 text-amber-800 border-amber-200'],
    optional:    ['Optional',    'bg-gray-100 text-gray-500 border-gray-200'],
    deprecated:  ['Deprecated',  'bg-red-50 text-red-700 border-red-200'],
  };
  const [rlabel, cls] = reqMap[s.requirement] || reqMap.optional;
  reqEl.innerHTML = `<span class="inline-flex items-center gap-1.5 font-mono text-[10px] px-2.5 py-1 rounded border ${cls}">
    <span class="w-1.5 h-1.5 rounded-full inline-block" style="background:currentColor;opacity:.7"></span>
    ${rlabel}
  </span>`;

  document.getElementById('schema-modal').showModal();
}
</script>
