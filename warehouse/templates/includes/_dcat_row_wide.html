{# Full-width (col-span-2) dcat field row. Expects: semantics, label, value #}
{% if value %}<div class="flex flex-col gap-1.5 px-5 py-3.5 border-r border-t border-gray-100 sm:col-start-1 sm:col-span-2">
  <div class="flex items-center gap-1.5 font-mono text-[9.5px] uppercase tracking-[1px] text-txt-muted">
    {{ label }}{% include "includes/_info_btn.html" with semantics=semantics %}
  </div>
  <div class="text-sm text-gray-700 leading-relaxed">{{ value }}</div>
</div>{% endif %}
