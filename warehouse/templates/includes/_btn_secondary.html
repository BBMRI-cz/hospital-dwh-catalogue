{% load i18n %}
{% comment %}
  Secondary button — white/bordered, matches sidebar Clear button.

  Variables (all optional):
    label        – translatable button text
    icon_svg     – raw SVG string to render before label
    href         – if given, renders as <a>; otherwise as <button>
    btn_type     – type attribute for <button>  (default: "button")
    onclick      – onclick attribute string
    extra_class  – additional CSS classes appended to the base class list
    extra_attrs  – raw extra HTML attributes string
{% endcomment %}
{% if href %}
<a href="{{ href }}"
   class="inline-flex items-center justify-center gap-1.5 h-8 px-3 rounded-md bg-white text-xs font-medium text-gray-500 border border-gray-200 transition-all duration-150 hover:bg-gray-50 hover:text-gray-700 hover:border-gray-300 active:scale-[0.97] {{ extra_class }}"
   {% if extra_attrs %}{{ extra_attrs }}{% endif %}>
  {% if icon_svg %}{{ icon_svg }}{% endif %}
  {% if label %}{% trans label %}{% endif %}
</a>
{% else %}
<button type="{{ btn_type|default:'button' }}"
   class="inline-flex items-center justify-center gap-1.5 h-8 px-3 rounded-md bg-white text-xs font-medium text-gray-500 border border-gray-200 transition-all duration-150 hover:bg-gray-50 hover:text-gray-700 hover:border-gray-300 active:scale-[0.97] {{ extra_class }}"
   {% if onclick %}onclick="{{ onclick }}"{% endif %}
   {% if extra_attrs %}{{ extra_attrs }}{% endif %}>
  {% if icon_svg %}{{ icon_svg }}{% endif %}
  {% if label %}{% trans label %}{% endif %}
</button>
{% endif %}
