{% load i18n %}
{# Expects: title, items, list_id, field_name #}
{% if items %}
<div>
  <div class="font-mono text-[9.5px] font-medium uppercase tracking-[1.5px] text-gray-500 mb-2">{{ title }}</div>
  <div class="relative mb-1.5">
    <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="{% trans 'Filter…' %}" oninput="filterList(this,'{{ list_id }}')"
      class="input input-sm input-bordered w-full pl-8 text-sm bg-gray-50 focus:bg-white">
  </div>
  <div class="flex flex-col gap-0.5 max-h-[130px] overflow-y-auto" id="{{ list_id }}">
    {% for item in items %}
    <label class="chk-item flex items-center gap-2 px-2 py-1 rounded-md hover:bg-gray-50 transition-colors cursor-pointer" title="{{ item.value }}">
      <input type="checkbox" name="{{ field_name }}" value="{{ item.value }}" class="checkbox checkbox-xs shrink-0" style="accent-color:#53c0d7"
        {% if item.checked %}checked{% endif %}>
      <span class="text-xs text-gray-600 truncate min-w-0 flex-1">{{ item.value }}</span>
      <span class="font-mono text-[10px] text-gray-400 shrink-0 pl-1">{{ item.count }}</span>
    </label>
    {% endfor %}
  </div>
</div>
{% endif %}
