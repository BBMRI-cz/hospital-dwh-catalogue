[project]
name = "hospital-dwh-catalogue"
version = "1.0.0"
description = "Hospital Data Warehouse Catalogue"
requires-python = ">=3.13"

[tool.ruff]
# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "warehouse/static/sneat",
    "node_modules",
    ".mypy_cache",
]

# Line length
line-length = 100

# Target Python version
target-version = "py313"

[tool.ruff.lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "DJ001",  # Avoid null=True on string fields (needed for existing DB schemas)
    "B904",   # Exception chaining (nice to have but not critical)
]

[tool.ruff.lint.per-file-ignores]
# Django settings use star imports by convention
"catalogue/settings/*.py" = ["F401", "F403", "F405", "E402"]
# Test files can have different style
"*/tests.py" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["catalogue", "warehouse", "fair_genomes", "ticketing"]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.format]
# Use single quotes
quote-style = "single"

# Indent with spaces
indent-style = "space"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]

# Less strict settings for existing codebase
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false

# Disable strict optional for Django
strict_optional = false

# Ignore missing imports for third-party libraries
ignore_missing_imports = true

# Don't require annotations
disallow_untyped_defs = false
check_untyped_defs = false

# Ignore misc errors (nullable field warnings)
disable_error_code = ["misc", "attr-defined", "arg-type", "assignment", "var-annotated", "return-value"]

# Exclude directories
exclude = [
    "migrations/",
    "warehouse/static/",
    "venv/",
    ".venv/",
]

[tool.django-stubs]
django_settings_module = "catalogue.settings.dev"

[tool.bandit]
exclude_dirs = ["tests", "warehouse/static/sneat", "venv", ".venv"]
skips = ["B101", "B104"]  # Skip assert warnings in tests, bind all interfaces (acceptable for dev)
