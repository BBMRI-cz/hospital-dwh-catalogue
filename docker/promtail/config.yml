server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: django_production
    static_configs:
      - targets:
          - localhost
        labels:
          job: django
          app: hospital-dwh-catalogue
          log_type: application
          __path__: /app/logs/app.log
    pipeline_stages:
      # Parse JSON fields emitted by pythonjsonlogger
      - json:
          expressions:
            levelname:
            name:
            request_id:
            message:
            http_method:
            http_path:
            http_status:
            duration_ms:
      # Promote parsed fields to Loki labels (kept low-cardinality)
      - labels:
          levelname:
          name:
      # Store request_id as a structured metadata field (not a label — high cardinality)
      - structured_metadata:
          request_id:

  - job_name: django_errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: django
          app: hospital-dwh-catalogue
          log_type: error
          __path__: /app/logs/error.log
    pipeline_stages:
      - json:
          expressions:
            levelname:
            name:
            request_id:
            message:
      - labels:
          levelname:
          name:
      - structured_metadata:
          request_id:
