server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: django_staging
    static_configs:
      - targets:
          - localhost
        labels:
          job: django
          app: hospital-dwh-catalogue
          __path__: /app/logs/app.log
    pipeline_stages:
      - json:
          expressions:
            levelname:
            name:
            request_id:
            message:
      - labels:
          levelname:
          name:
      - structured_metadata:
          request_id:

  - job_name: django_errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: django
          app: hospital-dwh-catalogue
          log_type: error
          __path__: /app/logs/error.log
    pipeline_stages:
      - json:
          expressions:
            levelname:
            name:
            request_id:
            message:
      - labels:
          levelname:
          name:
      - structured_metadata:
          request_id: