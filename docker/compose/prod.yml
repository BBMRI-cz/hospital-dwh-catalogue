services:
  db:
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 300 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    command: gunicorn catalogue.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4}
    restart: unless-stopped
    volumes:
      - staticfiles:/app/staticfiles
      - logs:/app/logs
      - ../../${MOU_ROOT_CA_CERT_PATH}:/usr/local/share/ca-certificates/MOURootCA.crt:ro
    environment:
      DJANGO_SETTINGS_MODULE: catalogue.settings.prod
      REDIS_URL: redis://redis:6379/1
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      LDAPTLS_CACERT: /etc/ssl/certs/ca-certificates.crt
      MOU_ROOT_CA_SHA256: ${MOU_ROOT_CA_SHA256:-}
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    restart: unless-stopped
    volumes:
      - logs:/app/logs
      - ../../${MOU_ROOT_CA_CERT_PATH}:/usr/local/share/ca-certificates/MOURootCA.crt:ro
    environment:
      DJANGO_SETTINGS_MODULE: catalogue.settings.prod
      REDIS_URL: redis://redis:6379/1
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      MOU_ROOT_CA_SHA256: ${MOU_ROOT_CA_SHA256:-}

  nginx:
    ports:
      - "443:443"
    restart: unless-stopped
    volumes:
      - ../../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../docker/nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf.template:ro
      - ../../docker/nginx/conf.d/includes:/etc/nginx/conf.d/includes:ro
      - ../../docker/nginx/error_pages:/etc/nginx/error_pages:ro
      - staticfiles:/app/staticfiles:ro
      - ../../${NGINX_SSL_CERT_PATH}:/etc/nginx/tls/server.crt:ro
      - ../../${NGINX_SSL_KEY_PATH}:/etc/nginx/tls/server.key:ro
    environment:
      SERVER_NAME: ${SERVER_NAME}
    command: >
      /bin/sh -c
      "envsubst '$$SERVER_NAME' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'"

volumes:
  redis_data:

networks:
  default:
    name: hospital_dwh_network
    driver: bridge
