name: hospital-dwh-${DEPLOY_ENV}

x-runtime-build: &runtime_build
  context: ../..
  dockerfile: docker/Dockerfile
  target: runtime

services:
  db:
    image: postgres:17
    env_file:
      - ../../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: *runtime_build
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    env_file:
      - ../../.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/scripts/check_login_health.py"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 30s

  scheduler:
    build: *runtime_build
    entrypoint: ["/bin/sh", "/app/docker/scheduler-entrypoint.sh"]
    env_file:
      - ../../.env
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  staticfiles:
  logs:
