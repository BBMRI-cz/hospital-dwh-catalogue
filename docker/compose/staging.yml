services:
  db:
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    command: gunicorn catalogue.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2}
    restart: unless-stopped
    volumes:
      - staticfiles:/app/staticfiles
      - logs:/app/logs
    environment:
      DJANGO_SETTINGS_MODULE: catalogue.settings.staging
      REDIS_URL: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    restart: unless-stopped
    volumes:
      - logs:/app/logs
    environment:
      DJANGO_SETTINGS_MODULE: catalogue.settings.staging
      REDIS_URL: redis://redis:6379/1

  nginx:
    ports:
      - "443:443"
    restart: unless-stopped
    volumes:
      - ../../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../docker/nginx/conf.d/staging.conf:/etc/nginx/conf.d/default.conf.template:ro
      - ../../docker/nginx/conf.d/includes:/etc/nginx/conf.d/includes:ro
      - ../../docker/nginx/error_pages:/etc/nginx/error_pages:ro
      - staticfiles:/app/staticfiles:ro
      - ../../${NGINX_SSL_CERT_PATH}:/etc/nginx/tls/server.crt:ro
      - ../../${NGINX_SSL_KEY_PATH}:/etc/nginx/tls/server.key:ro
    environment:
      SERVER_NAME: ${SERVER_NAME}
    command: >
      /bin/sh -c
      "envsubst '$$SERVER_NAME' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'"
