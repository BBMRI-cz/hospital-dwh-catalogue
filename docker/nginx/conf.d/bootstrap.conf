# ---------------------------------------------------------------------------
# Bootstrap conf – used automatically on first deployment when no Let's
# Encrypt certificate exists yet. Only listens on HTTP/80 and exposes the
# Certbot ACME webroot challenge path. Once a certificate has been issued,
# the production nginx startup command switches to the full HTTPS config on
# the next restart or reload.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name ${SERVER_NAME};

    # Certbot HTTP-01 ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Return 503 for everything else until TLS is set up
    location / {
        return 503;
    }
}
