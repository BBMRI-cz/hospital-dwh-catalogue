location = /internal/auth/grafana/ {
    internal;
    set $django http://web:8000;
    proxy_pass              $django;
    include /etc/nginx/conf.d/includes/proxy_headers.conf;
    proxy_set_header        Content-Length    "";
    proxy_pass_request_body off;
}

location @grafana_login_redirect {
    return 302 /accounts/login/?next=$request_uri;
}

location /grafana/ {
    auth_request      /internal/auth/grafana/;
    error_page 401  = @grafana_login_redirect;

    set $grafana http://grafana:3000;
    proxy_pass         $grafana;
    include /etc/nginx/conf.d/includes/proxy_headers.conf;
    proxy_read_timeout 60s;
}

location /grafana/api/live/ {
    auth_request      /internal/auth/grafana/;
    error_page 401  = @grafana_login_redirect;

    set $grafana http://grafana:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_pass         $grafana;
    include /etc/nginx/conf.d/includes/proxy_headers.conf;
}
