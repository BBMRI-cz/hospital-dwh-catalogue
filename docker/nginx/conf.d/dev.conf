# ---------------------------------------------------------------------------
# Development – plain HTTP on port 80
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://web:8000;

    # Proxy everything else to Gunicorn / Django dev server
    location / {
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # Show maintenance page when the app is not reachable
        error_page 502 503 504 /50x.html;
    }

    # Internal location for the error page – served by nginx itself
    location = /50x.html {
        root  /etc/nginx/error_pages;
        internal;
    }
}
