# ---------------------------------------------------------------------------
# Development – plain HTTP on port 80
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://web:8000;

    # Proxy everything else to Gunicorn / Django dev server
    location / {
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_intercept_errors on;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # Show maintenance page when the app is not reachable
        error_page 502 503 504 /50x.html;
    }

    # Internal auth_request subrequest endpoint (same gate as test/prod)
    location = /internal/auth/grafana/ {
        internal;
        set $django http://web:8000;
        proxy_pass              $django;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Request-Id      $request_id;
        proxy_set_header        Content-Length    "";
        proxy_pass_request_body off;
    }

    location @grafana_login_redirect {
        return 302 /accounts/login/?next=$request_uri;
    }

    # Grafana — staff-only via auth_request
    location /grafana/ {
        auth_request      /internal/auth/grafana/;
        error_page 401  = @grafana_login_redirect;

        set $grafana http://grafana:3000;
        proxy_pass         $grafana;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_read_timeout 60s;
    }

    location /grafana/api/live/ {
        auth_request      /internal/auth/grafana/;
        error_page 401  = @grafana_login_redirect;

        set $grafana http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_pass         $grafana;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
    }

    # Internal location for the error page – served by nginx itself
    location = /50x.html {
        root  /etc/nginx/error_pages;
        internal;
    }
}
