# ---------------------------------------------------------------------------
# Staging – plain HTTP on port 80
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://web:8000;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass $upstream;
        include /etc/nginx/conf.d/includes/proxy_headers.conf;
        proxy_intercept_errors on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        error_page 502 503 504 /50x.html;
    }

    include /etc/nginx/conf.d/includes/grafana_auth.conf;
    include /etc/nginx/conf.d/includes/error_page.conf;
}
