# ---------------------------------------------------------------------------
# Production – Let's Encrypt HTTPS
# ---------------------------------------------------------------------------

# Redirect plain HTTP → HTTPS, but allow Certbot ACME challenge on HTTP
server {
    listen 80;
    server_name ${SERVER_NAME};

    # Certbot webroot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    # Let's Encrypt certificate (obtain with Certbot before first HTTPS start)
    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     10m;

    # OCSP stapling – improves TLS handshake speed and client privacy.
    ssl_stapling            on;
    ssl_stapling_verify     on;
    ssl_trusted_certificate /etc/letsencrypt/live/${SERVER_NAME}/chain.pem;

    resolver         127.0.0.11 valid=10s;
    resolver_timeout 5s;
    set $upstream http://web:8000;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Static files served directly by nginx
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;

        add_header Cache-Control             "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           DENY always;
    }

    # Proxy everything else to Gunicorn
    location / {
        proxy_pass         $upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # Show maintenance page when the app is not reachable
        error_page 502 503 504 /50x.html;
    }

    # Internal location for the error page – served by nginx itself
    location = /50x.html {
        root  /etc/nginx/error_pages;
        internal;
    }
}
