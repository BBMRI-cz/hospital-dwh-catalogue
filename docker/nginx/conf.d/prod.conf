# ---------------------------------------------------------------------------
# Production – internal HTTPS
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name ${SERVER_NAME};

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     10m;

    resolver         127.0.0.11 valid=10s;
    resolver_timeout 5s;
    set $upstream http://web:8000;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control             "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           DENY always;
    }

    location / {
        proxy_pass $upstream;
        include /etc/nginx/conf.d/includes/proxy_headers.conf;
        proxy_intercept_errors on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        error_page 502 503 504 /50x.html;
    }

    include /etc/nginx/conf.d/includes/grafana_auth.conf;
    include /etc/nginx/conf.d/includes/error_page.conf;
}
