<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadatový katalog není k dispozici</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
            max-width: 520px;
            width: 100%;
            padding: 3rem 2.5rem;
            text-align: center;
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 1.25rem;
            line-height: 1;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #1a1a2e;
        }

        p {
            font-size: 1rem;
            line-height: 1.7;
            color: #555;
            margin-bottom: 0.75rem;
        }

        .hint {
            font-size: 0.85rem;
            color: #888;
            margin-top: 1.5rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }

        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">!</div>
        <h1>Metadatový katalog je momentálně nedostupný</h1>
        <p>
            Webová aplikace se právě spouští nebo probíhá technická&nbsp;údržba.
        </p>
        <p>
            Prosíme, zkuste to znovu za&nbsp;chvíli. Omlouváme se za působené nepříjemnosti.
        </p>
        <p class="hint">
            Pokud problém přetrvává, kontaktujte správce systému.
        </p>
    </div>
</body>
</html>
