services:
  db:
    image: postgres:17
    container_name: hospital_dwh_db_dev
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d dwhi_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hospital_dwh_web_dev
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=catalogue.settings.dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_dev:
    name: hospital_dwh_postgres_data_dev
