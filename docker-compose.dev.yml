name: hospital-dwh-catalogue

services:
  db:
    image: postgres:17
    container_name: hospital_dwh_db_dev
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hospital_dwh_web_dev
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=catalogue.settings.dev
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/')\""]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hospital_dwh_scheduler_dev
    entrypoint: ["/bin/sh", "/app/docker/scheduler-entrypoint.sh"]
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=catalogue.settings.dev
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: hospital_dwh_nginx_dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/error_pages:/etc/nginx/error_pages:ro
    depends_on:
      web:
        condition: service_started

  # --- Observability stack ---

  loki:
    image: grafana/loki:3.0.0
    container_name: hospital_dwh_loki_dev
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data_dev:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: hospital_dwh_promtail_dev
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail/config-dev.yml:/etc/promtail/config.yml:ro
      - ./logs:/app/logs:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: hospital_dwh_grafana_dev
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data_dev:
    name: hospital_dwh_postgres_data_dev
  loki_data_dev:
    name: hospital_dwh_loki_data_dev
  grafana_data_dev:
    name: hospital_dwh_grafana_data_dev
