{% load i18n static %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'cs' }}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% trans "Hospital Data Warehouse Catalogue" %}{% endblock %} - MMCI</title>

  <link href="{% static 'css/custom-fonts.css' %}" rel="stylesheet">
  <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
  <link href="{% static 'css/base.css' %}" rel="stylesheet">

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-page-bg font-sans min-h-screen {% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
</body>
</html>
