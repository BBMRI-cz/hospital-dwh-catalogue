{% extends "base.html" %}{% load i18n static %}

{% block title %}{% trans "Page Not Found" %}{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-6">

  <!-- Large 404 number -->
  <p class="font-serif text-[9rem] font-normal leading-none select-none text-mmci-cyan opacity-25">404</p>

  <!-- Heading -->
  <h1 class="font-serif text-3xl font-normal mt-2 text-mmci-dark">
    {% trans "Page Not Found" %}
  </h1>

  <!-- Description -->
  <p class="mt-4 text-base text-gray-500 max-w-md leading-relaxed">
    {% trans "The page you are looking for does not exist or has been moved." %}
  </p>

</div>
{% endblock %}
