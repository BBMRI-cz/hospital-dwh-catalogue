{% load i18n frontend_tags %}{% if value %}<div class="flex min-w-0 flex-col gap-1 border-r border-t border-gray-100 px-5 py-3.5">
  <div class="flex items-center gap-1.5 font-mono text-[9.5px] uppercase tracking-[1px] text-txt-muted leading-none">
    {{ semantics }}
    {% include "includes/_info_btn.html" with semantics=semantics %}
  </div>
  {% if value|is_list %}
  <div class="grid grid-cols-1 gap-1.5 sm:grid-cols-2">
    {% for item in value %}
    {% include "includes/_badge.html" with b_value=item only %}
    {% endfor %}
  </div>
  {% else %}
  <div class="text-[13px] font-medium leading-snug break-words text-gray-800" title="{{ value }}">{{ value }}</div>
  {% endif %}
</div>{% endif %}
