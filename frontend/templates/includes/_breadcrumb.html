<nav class="flex items-center gap-1.5 font-mono text-xs mb-6 flex-wrap">
  <a href="{{ bc_root_url }}" class="text-mmci-cyan hover:underline">{{ bc_root_label }}</a>

  {% if bc_mid_label %}
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-txt-muted shrink-0"><polyline points="9 18 15 12 9 6"/></svg>
  <a href="{{ bc_mid_url }}" class="text-mmci-cyan hover:underline truncate max-w-xs">{{ bc_mid_label }}</a>
  {% endif %}

  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-txt-muted shrink-0"><polyline points="9 18 15 12 9 6"/></svg>
  <span class="text-txt-muted truncate max-w-xs">{{ bc_current }}</span>
</nav>
