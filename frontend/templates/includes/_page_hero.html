<div class="mb-8 pb-7 border-b border-gray-200">
  <div class="flex items-start gap-4 flex-wrap">

    <div class="flex-1 min-w-0">
      <h1 class="font-serif text-4xl font-normal leading-tight {{ hero_title_class }}">
        {{ hero_title }}
      </h1>
      <p class="mt-3 text-base text-txt leading-relaxed max-w-2xl">
        {{ hero_subtitle }}
      </p>
    </div>

    <div class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center {{ hero_icon_class }}">
      {% if hero_icon == "cart" %}
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      {% elif hero_icon == "calendar" %}
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      {% endif %}
    </div>

    {% if hero_action_href %}
    <div class="shrink-0 self-start">
      <a href="{{ hero_action_href }}" class="btn btn-sm gap-1.5 text-white bg-mou-orange border-mou-orange">
        {% if hero_action_icon == "cart" %}
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        {% endif %}
        {{ hero_action_label }}
        {% if hero_action_count %}<span class="badge badge-xs">{{ hero_action_count }}</span>{% endif %}
      </a>
    </div>
    {% endif %}

  </div>
</div>
