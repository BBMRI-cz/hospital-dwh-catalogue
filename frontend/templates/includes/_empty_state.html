<div class="bg-white border border-gray-200 shadow-sm py-16 text-center">
  <div class="w-16 h-16 rounded-2xl mx-auto mb-4 flex items-center justify-center opacity-30 {{ es_icon_class }}">
    {% if es_icon == "cart" %}
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </svg>
    {% elif es_icon == "calendar" %}
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    {% endif %}
  </div>
  <p class="font-serif text-xl text-txt-muted mb-2">{{ es_heading }}</p>
  <p class="text-sm text-txt-muted mb-6 italic">{{ es_subtitle }}</p>
  {% include "includes/_btn_primary.html" with href=es_btn_href label=es_btn_label extra_class="mx-auto" %}
</div>
