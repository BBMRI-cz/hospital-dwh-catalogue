{% load i18n %}
{# Expects: title, items, list_id, field_name #}
<div x-data="{ q: '' }">
  <div class="font-mono text-[11px] font-bold uppercase tracking-[1.5px] text-txt-muted mb-2">{{ title }}</div>
  {% if items %}
  {% trans "Filter…" as filter_placeholder %}
  <div class="relative mb-1.5">
    <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-txt-muted pointer-events-none" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" x-model="q" placeholder="{{ filter_placeholder }}"
      class="block h-8 w-full rounded border border-gray-300 pl-8 pr-3 text-sm bg-gray-50 focus:outline-none focus:ring-1 focus:ring-mmci-cyan focus:border-mmci-cyan">
  </div>
  {% endif %}
  <div class="flex flex-col gap-0.5 max-h-[130px] overflow-y-auto" id="{{ list_id }}">
    {% for item in items %}
    <label class="chk-item flex items-center gap-2 px-2 py-1 rounded-md transition-colors cursor-pointer {% if item.checked %}bg-sky-50 hover:bg-sky-100{% else %}hover:bg-gray-50{% endif %}"
      title="{% if item.label and item.label != item.value %}{{ item.label }} | {{ item.value }}{% else %}{{ item.value }}{% endif %}"
      x-show="!q || $el.textContent.toLowerCase().includes(q.toLowerCase())">
      <input type="checkbox" name="{{ field_name }}" value="{{ item.value }}" class="checkbox checkbox-xs shrink-0 accent-mmci-cyan"
        {% if item.checked %}checked{% endif %}>
      <span class="text-xs {% if item.checked %}text-sky-700 font-medium{% else %}text-txt{% endif %} truncate min-w-0 flex-1">{{ item.label|default:item.value }}</span>
      <span class="font-mono text-[10px] {% if item.checked %}text-sky-500{% else %}text-txt-muted{% endif %} shrink-0 pl-1">{{ item.count }}</span>
    </label>
    {% empty %}
    <span class="px-2 py-1.5 text-xs italic text-txt-muted">{% trans "No options" %}</span>
    {% endfor %}
  </div>
</div>
